spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: social-network-v1

---
# Development profile (MySQL local)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3306/social_network_v1?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_ROOT_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mvc:
    servlet:
      load-on-startup: 1
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: nlg.bao1340@gmail.com
    password: auvx cvzl lkgx smrc
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT Configuration (dev)
jwt:
  privateKey: ${JWT_TOKEN:dev-secret-key-for-testing-only}

# AWS S3 Configuration (dev)
cloud:
  aws:
    enabled: false
    credentials:
      access-key: ${S3_ACCESS_KEY:no-key}
      secret-key: ${S3_SECRET_KEY:}
    region:
      static: ${S3_REGION:ap-southeast-2}
    stack:
      auto: false
    buket:
      name: ${S3_BUCKET_NAME:dummy-bucket}

aws:
  s3:
    enabled: ${AWS_S3_ENABLED:false}

# File Storage Configuration (dev)
file:
  storage:
    path: ${FILE_STORAGE_PATH:./uploads}

# Server Configuration (dev)
server:
  port: ${PORT:8080}
  address: 0.0.0.0

# CORS Configuration (dev)
cors:
  allowed:
    origins: http://localhost:3000,http://localhost:8080,http://localhost:8081

# Logging Configuration (dev)
logging:
  level:
    root: INFO
    com.nhoclahola.socialnetworkv1: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN

---
# Production profile (H2 in-memory)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:h2:mem:social_network;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  mvc:
    servlet:
      load-on-startup: 1
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: nlg.bao1340@gmail.com
    password: auvx cvzl lkgx smrc
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT Configuration (prod)
jwt:
  privateKey: ${JWT_TOKEN:}

# Cloud AWS Configuration (prod)
cloud:
  aws:
    enabled: false
    credentials:
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
    region:
      static: ${S3_REGION:ap-southeast-2}
    stack:
      auto: false
    buket:
      name: ${S3_BUCKET_NAME:dummy-bucket}

# AWS S3 Configuration (prod)
aws:
  s3:
    enabled: ${AWS_S3_ENABLED:false}

# File Storage Configuration (prod)
file:
  storage:
    path: ${FILE_STORAGE_PATH:/app/uploads}

# Server Configuration (prod)
server:
  port: ${PORT:8081}
  address: 0.0.0.0

# CORS Configuration (prod)
cors:
  allowed:
    origins: ${CORS_ALLOWED_ORIGINS:https://social-network-react-js-mosxy6ru7-nhoclaholas-projects.vercel.app,http://localhost:3000,http://localhost:8080,http://localhost:8081,https://social-network-react-js-ui.vercel.app,http://social-network-v1.kesug.com}

# Logging Configuration (prod)
logging:
  level:
    root: INFO
    com.nhoclahola.socialnetworkv1: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
