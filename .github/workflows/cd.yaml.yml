name: CD - Deploy to Render

on:
  workflow_run:
    workflows: ["CI - Build and Push Docker Image"]  # Trigger sau workflow CI
    types: [completed]  # Chỉ khi CI hoàn thành

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}  # Chỉ chạy nếu CI pass

    steps:
      - name: Checkout code  # Checkout để lấy code nếu cần (optional, nhưng tốt cho logging)
        uses: actions/checkout@v4

      - name: Trigger Render Deploy
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}  # Lấy từ Render dashboard
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}  # API key từ Render
        run: |
          curl -X POST \
          -H "Authorization: Bearer $RENDER_API_KEY" \
          -d '' \
          "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"

      # Optional: Kiểm tra deploy status (nếu muốn wait và check)
      - name: Check Deploy Status (Optional)
        run: |
          sleep 30  # Wait 30s cho deploy bắt đầu
          STATUS=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" | jq -r '.[0].status')
          if [ "$STATUS" != "live" ]; then
            echo "Deploy failed!"
            exit 1
          fi
        if: always()  # Chạy dù sao để log