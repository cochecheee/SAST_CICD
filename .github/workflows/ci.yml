name: CI Workflow (Gradle)

on:
  push:
    branches:
      - main  # chỉ trigger khi có push (merge) vào main

jobs:
  ci:
    name: Security & Build Pipeline
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      # ❌ Bỏ "security-events: write" vì không upload lên GitHub Security tab

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # để SonarQube phân tích đầy đủ lịch sử

      # Set up JDK
      - name: Set up JDK 17 for Gradle
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Initialize CodeQL (chạy phân tích cục bộ, không upload)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      # Build project cho CodeQL phân tích
      - name: Build with Gradle
        run: ./gradlew compileJava --no-daemon

      # Perform CodeQL Analysis (chỉ xuất SARIF ra artifact)
      - name: Perform CodeQL Analysis (local)
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results.sarif  # ✅ xuất kết quả cục bộ, không upload
          category: "/language:java"

      # Upload SARIF file làm artifact (để tải về)
      - name: Upload CodeQL Results
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results.sarif

      # Convert CodeQL SARIF to Sonar format (để đưa vào SonarQube)
      - name: Convert CodeQL SARIF to Sonar format
        run: |
          python scripts/convert_codeql_to_sonar.py \
            --input codeql-results.sarif \
            --output sonar-issues.json

      # Cài Dependency-Check (OWASP)
      - name: Install Dependency-Check
        run: |
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v9.2.0/dependency-check-9.2.0-release.zip
          unzip dependency-check-9.2.0-release.zip
          echo "$PWD/dependency-check/bin" >> $GITHUB_PATH

      # Quét lỗ hổng dependency
      - name: Run Dependency-Check
        run: |
          dependency-check --scan . --out build/reports --format XML --format JSON

      # Build & Test
      - name: Build & Test (Gradle)
        run: ./gradlew clean build --no-daemon

      # SonarQube Scan (gộp các báo cáo CodeQL & OWASP)
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=sast-social
            -Dsonar.externalIssuesReportPaths=sonar-issues.json
            -Dsonar.dependencyCheck.xmlReportPath=build/reports/dependency-check-report.xml
            -Dsonar.dependencyCheck.jsonReportPath=build/reports/dependency-check-report.json

      # Kiểm tra Quality Gate
      - name: Check SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          timeout: 300

      # Build Docker image
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest .

      # Scan Docker image với Trivy
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Push image
      - name: Push Docker Image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest

      # Upload toàn bộ báo cáo Security
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            build/reports/dependency-check-report.*
            sonar-issues.json
            codeql-results.sarif
