name: CI Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # 1. BASE BUILD & JAVA ANALYSIS
  # Compiles code and runs Java-specific low-level analysis (SpotBugs)
  build:
    name: Build & SpotBugs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build and Run SpotBugs
        # Runs build, skips tests for speed (optional), runs spotbugs
        run: ./gradlew clean build spotbugsMain -x test --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-classes
          path: build/classes/java/main
          retention-days: 1

      - name: Upload SpotBugs Report
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/*.sarif
          retention-days: 1

  # 2. SECRET SCANNING (Gitleaks)
  # Dedicated tool for finding passwords/keys. Very fast.
  secrets-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # 3. SEMGREP (Modern SAST)
  # Provides rich data in SARIF format. Often faster than CodeQL.
  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config=auto --sarif --output=semgrep.sarif
      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif

  # 4. CODEQL (Deep Semantic Analysis)
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
          output: codeql-results # Saves the SARIF folder locally

      - name: Upload CodeQL SARIF
        uses: actions/upload-artifact@v4
        with:
          name: codeql-report
          path: codeql-results/java.sarif

  # 5. DEPENDENCY CHECK (SCA)
  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew dependencyCheckAnalyze --no-daemon -Dformats=JSON,HTML

      - name: Upload Dependency Report
        uses: actions/upload-artifact@v4
        with:
          name: dep-check-report
          path: build/reports/dependency-check-report.json

  # 6. TRIVY FILESYSTEM SCAN
  # Scanning the filesystem (repo) allows Sonar to map vuln to files.
  # Scanning the Docker image (binary) is hard to import to Sonar.
  trivy-fs:
    name: Trivy Repo Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy in FS mode (SARIF output)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-fs.sarif

  # 7. SONARQUBE AGGREGATOR
  # This job collects ALL data and sends it to the server.
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build, codeql, semgrep, dependency-check, trivy-fs]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download ALL reports from previous jobs
      - name: Download Build Classes
        uses: actions/download-artifact@v4
        with:
          name: build-classes
          path: build/classes/java/main

      - name: Download SpotBugs
        uses: actions/download-artifact@v4
        with:
          name: spotbugs-report
          path: reports/spotbugs

      - name: Download CodeQL
        uses: actions/download-artifact@v4
        with:
          name: codeql-report
          path: reports/codeql

      - name: Download Semgrep
        uses: actions/download-artifact@v4
        with:
          name: semgrep-report
          path: reports/semgrep

      - name: Download Trivy
        uses: actions/download-artifact@v4
        with:
          name: trivy-report
          path: reports/trivy

      - name: Download Dep Check
        uses: actions/download-artifact@v4
        with:
          name: dep-check-report
          path: reports/depcheck

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          chmod +x gradlew
          ./gradlew sonar --no-daemon \
            -Dsonar.projectKey=sast-social \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.java.binaries=build/classes/java/main \
            -Dsonar.dependencyCheck.jsonReportPath=reports/depcheck/dependency-check-report.json \
            -Dsonar.sarif.reportPaths=reports/codeql/java.sarif,reports/semgrep/semgrep.sarif,reports/trivy/trivy-fs.sarif,reports/spotbugs/main.sarif

  # 8. DOCKER BUILD & PUSH
  # Runs only if Sonar passes (optional, remove 'needs' if you want it to run regardless)
  docker:
    name: Docker Build & Push
    needs: [sonarqube]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest