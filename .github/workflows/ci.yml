name: CI Workflow (Gradle)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  ci:
    name: Security & Build Pipeline
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ========================================
      # SETUP
      # ========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # ========================================
      # BUILD & TEST
      # ========================================
      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon -x test
      # ========================================
      # SONARQUBE SCAN
      # ========================================
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Verify SonarQube Connection
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "🔍 Verifying SonarQube configuration..."
          
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "❌ ERROR: SONAR_HOST_URL is not set"
            exit 1
          fi
          
          if [ -z "$SONAR_TOKEN" ]; then
            echo "❌ ERROR: SONAR_TOKEN is not set"
            exit 1
          fi
          
          SONAR_URL="${SONAR_HOST_URL%/}"
          echo "✅ SonarQube URL: $SONAR_URL"
          
          # Test connection
          echo "🔗 Testing connection to SonarQube..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -u "${SONAR_TOKEN}:" "${SONAR_URL}/api/system/status" || echo "000")
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Successfully connected to SonarQube"
          else
            echo "⚠️ Warning: Cannot connect to SonarQube (HTTP $HTTP_CODE)"
            echo "Please check:"
            echo "  1. SONAR_HOST_URL is correct and accessible"
            echo "  2. SONAR_TOKEN is valid"
            echo "  3. SonarQube server is running"
            echo "  4. Network/firewall allows connection"
          fi
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "🚀 Starting SonarQube scan..."
          
          SONAR_URL="${SONAR_HOST_URL%/}"
          
          set +e
          ./gradlew sonar \
            --info \
            --no-daemon \
            -Dsonar.projectKey=sast-social \
            -Dsonar.projectName=sast-social \
            -Dsonar.host.url="${SONAR_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=build/classes/java/main \
            -Dsonar.exclusions='**/test/**,**/build/**,**/node_modules/**'
          
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ SonarQube scan completed successfully"
          else
            echo "⚠️ SonarQube scan failed with exit code $EXIT_CODE"
            echo "Continuing workflow..."
          fi
        continue-on-error: true
      - name: Check SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          scanMetadataReportFile: build/sonar/report-task.txt
          timeout: 300
        continue-on-error: true
      # ========================================
      # DOCKER BUILD & SCAN
      # ========================================
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest .
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest
      # ========================================
      # UPLOAD ARTIFACTS
      # ========================================
      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/reports/