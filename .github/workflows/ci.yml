name: CI Workflow (Gradle)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Security & Build Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      # ========================================
      # SETUP
      # ========================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ========================================
      # CODEQL ANALYSIS
      # ========================================

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build for CodeQL
        run: ./gradlew compileJava --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
          upload: false
          output: codeql-results

      - name: Copy SARIF file
        run: |
          if [ -f "codeql-results/java.sarif" ]; then
            cp codeql-results/java.sarif codeql-results.sarif
            echo "✅ Copied SARIF file"
          else
            echo "⚠️ SARIF file not found, searching..."
            find . -name "*.sarif" -type f -exec cp {} codeql-results.sarif \;
          fi

      - name: Convert CodeQL SARIF to Sonar format
        run: |
          if [ -f "scripts/convert_codeql_to_sonar.py" ]; then
            python scripts/convert_codeql_to_sonar.py \
              --input codeql-results.sarif \
              --output sonar-issues.json
          else
            echo "⚠️ Converter script not found, creating empty report"
            echo '{"issues":[]}' > sonar-issues.json
          fi

      # ========================================
      # DEPENDENCY-CHECK
      # ========================================

      - name: Cache Dependency-Check
        uses: actions/cache@v4
        with:
          path: |
            dependency-check
            ~/.gradle/dependency-check-data
          key: ${{ runner.os }}-dependency-check-10.0.4-${{ hashFiles('**/build.gradle', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-10.0.4-

      - name: Install Dependency-Check
        run: |
          if [ ! -d "dependency-check" ]; then
            echo "📥 Downloading Dependency-Check v10.0.4..."
            wget -q https://github.com/jeremylong/DependencyCheck/releases/download/v10.0.4/dependency-check-10.0.4-release.zip
            unzip -q dependency-check-10.0.4-release.zip
            echo "✅ Installation complete"
          else
            echo "✅ Using cached Dependency-Check"
          fi

      - name: Run Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p build/reports
          
          CMD="./dependency-check/bin/dependency-check.sh"
          CMD="$CMD --scan ."
          CMD="$CMD --out build/reports"
          CMD="$CMD --format XML --format JSON --format HTML"
          CMD="$CMD --project aloute-spring"
          CMD="$CMD --exclude '**/node_modules/**' --exclude '**/test/**' --exclude '**/.git/**'"
          
          if [ -n "$NVD_API_KEY" ]; then
            echo "✅ Using NVD API Key"
            CMD="$CMD --nvdApiKey $NVD_API_KEY --nvdApiDelay 6000"
          else
            echo "⚠️ No NVD API Key - using offline mode"
            CMD="$CMD --noupdate"
          fi
          
          [ -f "dependency-check-suppressions.xml" ] && CMD="$CMD --suppression dependency-check-suppressions.xml"
          
          CMD="$CMD --data ~/.gradle/dependency-check-data"
          
          set +e
          $CMD
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -ne 0 ] && [ ! -f "build/reports/dependency-check-report.xml" ]; then
            echo "⚠️ Creating empty reports to continue pipeline"
            echo '<?xml version="1.0"?><analysis></analysis>' > build/reports/dependency-check-report.xml
            echo '{"dependencies":[]}' > build/reports/dependency-check-report.json
          fi

      # ========================================
      # BUILD & TEST
      # ========================================

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon -x test

      # ========================================
      # SONARQUBE SCAN (GRADLE PLUGIN)
      # ========================================

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Debug SonarQube Configuration
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "🔍 Checking SonarQube configuration..."
          
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "❌ ERROR: SONAR_HOST_URL is empty!"
            exit 1
          fi
          
          # Kiểm tra độ dài
          URL_LENGTH=${#SONAR_HOST_URL}
          echo "URL length: $URL_LENGTH characters"
          
          # Kiểm tra 10 ký tự đầu
          URL_PREFIX="${SONAR_HOST_URL:0:10}"
          echo "URL starts with: $URL_PREFIX"
          
          # Kiểm tra có http/https không
          if [[ "$SONAR_HOST_URL" =~ ^https?:// ]]; then
            echo "✅ URL has valid scheme (http/https)"
          else
            echo "❌ ERROR: URL missing http:// or https://"
            echo "Please update the SONAR_HOST_URL secret to include the scheme"
            exit 1
          fi
          
          echo "✅ Configuration looks valid"

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "🚀 Starting SonarQube scan..."
          
          ./gradlew sonar \
            --info \
            --no-daemon \
            -Dsonar.projectKey=sast-social \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.externalIssuesReportPaths=sonar-issues.json \
            -Dsonar.dependencyCheck.xmlReportPath=build/reports/dependency-check-report.xml \
            -Dsonar.dependencyCheck.jsonReportPath=build/reports/dependency-check-report.json

      # ========================================
      # DOCKER BUILD & SCAN
      # ========================================

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest .

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest

      # ========================================
      # UPLOAD ARTIFACTS
      # ========================================

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            build/reports/dependency-check-report.*
            sonar-issues.json
            codeql-results.sarif
            codeql-results/java.sarif
        if: always()