name: CI Workflow

# Thin caller → reusable SAST pipeline cochecheee/sast-action.
# Replaces the former inline pipeline (backup: .github/_legacy_backup/ci.yml.bak).
# Name kept as "CI Workflow" so cd.yml (workflow_run trigger) still fires.
# Runs (language=java): Semgrep · CodeQL · Trivy-FS · SpotBugs · Dep-Check → security gate.
# Gate fails at: critical >= 1 OR high >= 5. App ships log4j 2.14.1 (Log4Shell)
# so the gate fails by design — use a knob below to demo a pass.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write          # required by the reusable workflow's dast job (validated even when dast is off)

jobs:
  security:
    uses: cochecheee/sast-action/.github/workflows/sast-ci.yml@master
    with:
      language: java
      # V3.1 Tier 4 — id của project này trong MCP Gateway (ALO = project 2).
      # Khi set, Security Gate hỏi /findings/gate-count (đã loại REVOKED) thay
      # vì đếm raw SARIF → false-positive đã /revoke sẽ không chặn CI lần sau.
      mcp_project_id: 2
      # ---- Gate knobs (defaults shown — uncomment to override) ----
      # gate_enabled: false          # bypass the gate entirely
      # gate_fail_on_critical: 1     # fail at >= N critical
      # gate_fail_on_high: 5         # fail at >= N high

      # ---- DAST (per-project, V3.x) ----
      # The reusable DAST job is decoupled from its CD: with deploy:false it
      # scans the live staging_url (deployed by THIS repo's cd.yml) after SAST,
      # regardless of the gate verdict — so the deliberately-vulnerable app is
      # still DAST-ed. Needs the sast-action DAST-decouple on @master (PR
      # feat/per-project-dast). Set the STAGING_URL repo *variable*
      # (Settings → Secrets and variables → Actions → Variables) to the Render
      # URL; if unset, the DAST job skips safely.
      dast: true
      staging_url: ${{ vars.STAGING_URL }}
      dast_scan_type: baseline
    secrets:
      dashboard_url:   ${{ secrets.MCP_GATEWAY_URL }}    # MCP gateway (notify + gate-count)
      dashboard_token: ${{ secrets.MCP_WEBHOOK_TOKEN }}
      nvd_api_key:     ${{ secrets.NVD_API_KEY }}        # OWASP Dep-Check (Java)
