name: CI Workflow (Gradle)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Security & Build Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      # ========================================
      # SETUP
      # ========================================

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ========================================
      # CODEQL ANALYSIS
      # ========================================

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build for CodeQL
        run: ./gradlew compileJava --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
          upload: false
          output: codeql-results

      - name: Copy SARIF file
        run: |
          if [ -f "codeql-results/java.sarif" ]; then
            cp codeql-results/java.sarif codeql-results.sarif
            echo "✅ Copied SARIF file"
          else
            echo "⚠️ SARIF file not found, searching..."
            find . -name "*.sarif" -type f -exec cp {} codeql-results.sarif \;
          fi

      - name: Convert CodeQL SARIF to Sonar format
        run: |
          if [ -f "scripts/convert_codeql_to_sonar.py" ]; then
            python scripts/convert_codeql_to_sonar.py \
              --input codeql-results.sarif \
              --output sonar-issues.json
          else
            echo "⚠️ Converter script not found, creating empty report"
            echo '{"issues":[]}' > sonar-issues.json
          fi

      # ========================================
      # DEPENDENCY-CHECK
      # ========================================

      - name: Cache Dependency-Check
        uses: actions/cache@v4
        with:
          path: |
            dependency-check
            ~/OWASP-Dependency-Check/data
          key: ${{ runner.os }}-dependency-check-9.2.0-${{ hashFiles('**/build.gradle', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-9.2.0-
            ${{ runner.os }}-dependency-check-

      - name: Install Dependency-Check
        run: |
          if [ ! -d "dependency-check" ]; then
            echo "📥 Downloading Dependency-Check v9.2.0 (stable)..."
            wget -q https://github.com/jeremylong/DependencyCheck/releases/download/v9.2.0/dependency-check-9.2.0-release.zip
            unzip -q dependency-check-9.2.0-release.zip
            echo "✅ Installation complete"
          else
            echo "✅ Using cached Dependency-Check"
          fi

      - name: Run Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p build/reports
          echo "🔍 Running Dependency-Check scan..."
          
          # Build command
          CMD="./dependency-check/bin/dependency-check.sh"
          CMD="$CMD --scan ."
          CMD="$CMD --out build/reports"
          CMD="$CMD --format XML"
          CMD="$CMD --format JSON"
          CMD="$CMD --format HTML"
          CMD="$CMD --project aloute-spring"
          CMD="$CMD --exclude '**/node_modules/**'"
          CMD="$CMD --exclude '**/test/**'"
          CMD="$CMD --exclude '**/.git/**'"
          
          # Add NVD API key if available
          if [ -n "$NVD_API_KEY" ]; then
            echo "✅ Using NVD API Key (faster updates)"
            CMD="$CMD --nvdApiKey $NVD_API_KEY"
          else
            echo "⚠️ No NVD API Key - get one at: https://nvd.nist.gov/developers/request-an-api-key"
          fi
          
          # Add suppression file if exists
          if [ -f "dependency-check-suppressions.xml" ]; then
            CMD="$CMD --suppression dependency-check-suppressions.xml"
            echo "✅ Using suppression file"
          fi
          
          # Execute with error handling
          set +e
          $CMD
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Dependency-Check completed successfully"
          elif [ -f "build/reports/dependency-check-report.xml" ]; then
            echo "⚠️ Dependency-Check completed with warnings but reports generated"
          else
            echo "❌ Dependency-Check failed, creating empty reports"
            echo '<?xml version="1.0"?><analysis></analysis>' > build/reports/dependency-check-report.xml
            echo '{"dependencies":[]}' > build/reports/dependency-check-report.json
          fi
          
          echo "📋 Generated reports:"
          ls -lh build/reports/ || echo "No reports found"

      # ========================================
      # BUILD & TEST
      # ========================================

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon -x test

      - name: Run Tests
        run: ./gradlew test --no-daemon
        continue-on-error: true

      # ========================================
      # SONARQUBE SCAN
      # ========================================

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "🚀 Starting SonarQube scan..."
          
          # Validate configuration
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "❌ ERROR: SONAR_HOST_URL is not set"
            exit 1
          fi
          
          if [ -z "$SONAR_TOKEN" ]; then
            echo "❌ ERROR: SONAR_TOKEN is not set"
            exit 1
          fi
          
          # Remove trailing slash from URL if present
          SONAR_URL="${SONAR_HOST_URL%/}"
          
          echo "Using SonarQube URL: $SONAR_URL"
          
          # Run SonarQube scan
          ./gradlew sonar \
            --info \
            --no-daemon \
            -Dsonar.projectKey=sast-social \
            -Dsonar.projectName=Asast-social \
            -Dsonar.host.url="${SONAR_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=build/classes/java/main \
            -Dsonar.externalIssuesReportPaths=sonar-issues.json \
            -Dsonar.dependencyCheck.xmlReportPath=build/reports/dependency-check-report.xml \
            -Dsonar.dependencyCheck.jsonReportPath=build/reports/dependency-check-report.json \
            -Dsonar.exclusions='**/test/**,**/build/**,**/node_modules/**'

      - name: Check SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          timeout: 300
        continue-on-error: true

      # ========================================
      # DOCKER BUILD & SCAN
      # ========================================

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest .

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest

      # ========================================
      # UPLOAD ARTIFACTS
      # ========================================

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            build/reports/dependency-check-report.*
            sonar-issues.json
            codeql-results.sarif
            codeql-results/java.sarif
        if: always()