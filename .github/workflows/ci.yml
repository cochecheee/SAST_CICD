name: CI Workflow (Gradle)

on:
  push:
    branches:
      - main  # chỉ trigger khi có push (merge) vào main

jobs:
  ci:
    name: Security & Build Pipeline
    runs-on: ubuntu-latest

    # chỉ chạy nếu merge commit đến từ dev
    if: startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, 'from dev')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Set up JDK
      - name: Set up JDK 17 for Gradle
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      # Run CodeQL
      - name: Run CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results.sarif
      # Convert CodeQL report type to SonarQube report type
      - name: Convert CodeQL SARIF to Sonar format
        run: python scripts/convert_codeql_to_sonar.py
      # Sonarqube Scanner
      - name: Sonar Scan
        uses: sonarsource/sonarqube-scan-action@v3
        with:
          args: >
            -Dsonar.projectKey=myproject
            -Dsonar.externalIssuesReportPaths=sonar-codeql.json

      # Cài Dependency-Check (OWASP)
      - name: Install Dependency-Check
        run: |
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v9.2.0/dependency-check-9.2.0-release.zip
          unzip dependency-check-9.2.0-release.zip
          export PATH=$PATH:$(pwd)/dependency-check/bin

      # Quét lỗ hổng dependency (không fail, chỉ tạo báo cáo)
      - name: Run Dependency-Check (Generate Report)
        run: |
          dependency-check --scan . --out build/reports/dependency-check-report.xml --format XML --format JSON

      # Kiểm tra, build và test bằng Gradle
      - name: Build & Test (Gradle)
        run: ./gradlew clean build --no-daemon
      # SonarQube Analysis
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=aloute-spring
            -Dsonar.dependencyCheck.xmlReportPath=build/reports/dependency-check-report.xml
            -Dsonar.dependencyCheck.jsonReportPath=build/reports/dependency-check-report.json

      # Kiểm tra Quality Gate
      - name: Check SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          timeout: 300
      # Build Docker image
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest .
      # Scan Docker image với Trivy
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest'
          format: 'table'
          exit-code: '1' # Fail nếu có CRITICAL
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
      # Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # Push image
      - name: Push Docker Image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest
      # Upload báo cáo Dependency-Check & GitLeaks làm artifact
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            build/reports/dependency-check-report.*
            gitleaks-report.json


