name: CI Workflow (Gradle)

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Security & Build Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up JDK
      - name: Set up JDK 17 for Gradle
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      # Build project cho CodeQL phân tích
      - name: Build with Gradle
        run: ./gradlew compileJava --no-daemon

      # Perform CodeQL Analysis
      - name: Perform CodeQL Analysis (local only)
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
          upload: false
          output: codeql-results

      # Copy SARIF file
      - name: Copy SARIF file
        run: |
          if [ -f "codeql-results/java.sarif" ]; then
            cp codeql-results/java.sarif codeql-results.sarif
            echo "✅ Copied SARIF file to codeql-results.sarif"
          else
            echo "❌ SARIF file not found, searching..."
            find . -name "*.sarif" -type f -exec cp {} codeql-results.sarif \;
          fi

      # Convert CodeQL SARIF to Sonar format
      - name: Convert CodeQL SARIF to Sonar format
        run: |
          python scripts/convert_codeql_to_sonar.py \
            --input codeql-results.sarif \
            --output sonar-issues.json

      # Cache Dependency-Check
      - name: Cache Dependency-Check
        uses: actions/cache@v4
        with:
          path: |
            dependency-check
            ~/.gradle/dependency-check-data
          key: ${{ runner.os }}-dependency-check-10.0.4-${{ hashFiles('**/build.gradle', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-10.0.4-
            ${{ runner.os }}-dependency-check-

      # Install Dependency-Check
      - name: Install Dependency-Check
        run: |
          if [ ! -d "dependency-check" ]; then
            echo "📥 Downloading Dependency-Check v10.0.4..."
            wget -q https://github.com/jeremylong/DependencyCheck/releases/download/v10.0.4/dependency-check-10.0.4-release.zip
            echo "📦 Extracting..."
            unzip -q dependency-check-10.0.4-release.zip
            echo "✅ Installation complete"
          else
            echo "✅ Using cached Dependency-Check"
          fi

      # Run Dependency-Check
      - name: Run Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p build/reports
          echo "🔍 Running Dependency-Check scan..."
          
          CMD="./dependency-check/bin/dependency-check.sh"
          CMD="$CMD --scan ."
          CMD="$CMD --out build/reports"
          CMD="$CMD --format XML"
          CMD="$CMD --format JSON"
          CMD="$CMD --format HTML"
          CMD="$CMD --project aloute-spring"
          CMD="$CMD --exclude '**/node_modules/**'"
          CMD="$CMD --exclude '**/test/**'"
          CMD="$CMD --exclude '**/tests/**'"
          CMD="$CMD --exclude '**/.git/**'"
          
          if [ -n "$NVD_API_KEY" ]; then
            echo "✅ Using NVD API Key"
            CMD="$CMD --nvdApiKey $NVD_API_KEY"
            CMD="$CMD --nvdApiDelay 6000"
            CMD="$CMD --nvdMaxRetryCount 5"
          else
            echo "⚠️ No NVD API Key - using offline mode"
            CMD="$CMD --noupdate"
          fi
          
          if [ -f "dependency-check-suppressions.xml" ]; then
            CMD="$CMD --suppression dependency-check-suppressions.xml"
          fi
          
          CMD="$CMD --connectionTimeout 60000"
          CMD="$CMD --data ~/.gradle/dependency-check-data"
          
          set +e
          $CMD 2>&1 | tee dependency-check.log
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Dependency-Check completed successfully"
          elif [ -f "build/reports/dependency-check-report.xml" ]; then
            echo "⚠️ Dependency-Check completed with warnings"
          else
            echo "⚠️ Creating empty reports to continue pipeline"
            echo '<?xml version="1.0"?><analysis></analysis>' > build/reports/dependency-check-report.xml
            echo '{"dependencies":[]}' > build/reports/dependency-check-report.json
          fi
          
          ls -lh build/reports/ 2>/dev/null || echo "No reports"

      # Build & Test
      - name: Build & Test (Gradle)
        run: ./gradlew clean build --no-daemon -x test

      # ========================================
      # SONARQUBE SCAN - FIXED VERSION1
      # ========================================

      # Cache SonarQube packages
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # SonarQube Scan với action v6 (mới nhất)
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=sast-social
            -Dsonar.sources=src/main
            -Dsonar.tests=src/test
            -Dsonar.java.binaries=build/classes
            -Dsonar.externalIssuesReportPaths=sonar-issues.json
            -Dsonar.dependencyCheck.xmlReportPath=build/reports/dependency-check-report.xml
            -Dsonar.dependencyCheck.jsonReportPath=build/reports/dependency-check-report.json

      # Check Quality Gate
      - name: Check SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Build Docker image
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest .

      # Scan Docker image with Trivy
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Push Docker image
      - name: Push Docker Image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest

      # Upload Security Reports
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            build/reports/dependency-check-report.*
            sonar-issues.json
            codeql-results.sarif
            codeql-results/java.sarif
            dependency-check.log
        if: always()