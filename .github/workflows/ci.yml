name: Optimized CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  # ============================================
  # JOB 1: Build & Unit Tests (Fast Feedback)
  # ============================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cache-key: ${{ steps.cache-gradle.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle packages
        id: cache-gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew clean build --no-daemon --build-cache

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/libs/*.jar
            build/classes/java/main/**
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/
          retention-days: 7

  # ============================================
  # JOB 2: Security Scans (Parallel)
  # ============================================
  security-scan:
    name: Security Analysis
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scanner: [codeql, dependency-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      # --- CodeQL Scanning ---
      - name: Initialize CodeQL
        if: matrix.scanner == 'codeql'
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Build for CodeQL
        if: matrix.scanner == 'codeql'
        run: ./gradlew build -x test --no-daemon --build-cache

      - name: Perform CodeQL Analysis
        if: matrix.scanner == 'codeql'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
          output: codeql-results
          upload: true

      - name: Process CodeQL Results
        if: matrix.scanner == 'codeql'
        run: |
          SARIF_FILE=$(find codeql-results -name "*.sarif" | head -n 1)
          if [ -n "$SARIF_FILE" ]; then
            jq '.runs[].results' "$SARIF_FILE" > codeql-results.json
          
            # Count critical issues
            CRITICAL_COUNT=$(jq '[.[] | select(.level == "error")] | length' codeql-results.json)
            echo "critical_issues=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
          
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "::error::Found $CRITICAL_COUNT critical security issues"
            fi
          fi

      - name: Upload CodeQL Results
        if: matrix.scanner == 'codeql'
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: |
            codeql-results/
            codeql-results.json
          retention-days: 30

      # --- Dependency Check ---
      - name: Cache Dependency-Check Data
        if: matrix.scanner == 'dependency-check'
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ hashFiles('**/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-

      - name: Run OWASP Dependency-Check
        if: matrix.scanner == 'dependency-check'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./gradlew dependencyCheckAnalyze \
            --no-daemon \
            --build-cache \
            -Dnvd.api.key="${NVD_API_KEY}" \
            -Dformats=HTML,JSON \
            -Dfailbuild=false
        continue-on-error: true

      - name: Parse Dependency-Check Results
        if: matrix.scanner == 'dependency-check'
        run: |
          if [ -f "build/reports/dependency-check-report.json" ]; then
            HIGH_VULNS=$(jq '[.dependencies[].vulnerabilities[] | select(.severity == "HIGH" or .severity == "CRITICAL")] | length' build/reports/dependency-check-report.json || echo "0")
            echo "high_vulnerabilities=$HIGH_VULNS" >> $GITHUB_OUTPUT
          
            if [ "$HIGH_VULNS" -gt 0 ]; then
              echo "::warning::Found $HIGH_VULNS high/critical vulnerabilities"
            fi
          fi

      - name: Upload Dependency-Check Results
        if: matrix.scanner == 'dependency-check'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-results
          path: build/reports/dependency-check-report.*
          retention-days: 30

  # ============================================
  # JOB 3: SonarQube Analysis (Conditional)
  # ============================================
  sonarqube:
    name: SonarQube Analysis
    needs: [build, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Download Security Results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-results'
          merge-multiple: true
          path: security-reports/

      - name: Verify SonarQube Connection
        id: verify
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/system/status" || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: SonarQube Scan
        if: steps.verify.outputs.skip != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ./gradlew sonar \
            --no-daemon \
            --build-cache \
            -Dsonar.projectKey=sast-social \
            -Dsonar.projectName=sast-social \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=build/classes/java/main \
            -Dsonar.dependencyCheck.jsonReportPath=security-reports/dependency-check-report.json

      - name: Quality Gate Check
        if: steps.verify.outputs.skip != 'true'
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: build/sonar/report-task.txt

  # ============================================
  # JOB 4: Docker Build & Scan (Conditional)
  # ============================================
  docker:
    name: Docker Build & Scan
    needs: [build, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/aloute-spring:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/aloute-spring:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Generate Trivy JSON Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/aloute-spring:${{ github.sha }}
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.*
          retention-days: 30

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/aloute-spring:${{ github.sha }} \
                     ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest

  # ============================================
  # JOB 5: Security Summary Report
  # ============================================
  security-summary:
    name: Security Summary
    needs: [security-scan, sonarqube, docker]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results/

      - name: Generate Security Report
        run: |
          echo "# 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status | Critical | High | Medium |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|----------|------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # CodeQL
          if [ -f "all-results/codeql-results/codeql-results.json" ]; then
            CODEQL_CRITICAL=$(jq '[.[] | select(.level == "error")] | length' all-results/codeql-results/codeql-results.json || echo "0")
            echo "| CodeQL | ✅ | $CODEQL_CRITICAL | - | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Dependency-Check
          if [ -f "all-results/dependency-check-results/dependency-check-report.json" ]; then
            DC_CRITICAL=$(jq '[.dependencies[].vulnerabilities[] | select(.severity == "CRITICAL")] | length' all-results/dependency-check-results/dependency-check-report.json || echo "0")
            DC_HIGH=$(jq '[.dependencies[].vulnerabilities[] | select(.severity == "HIGH")] | length' all-results/dependency-check-results/dependency-check-report.json || echo "0")
            echo "| OWASP DC | ✅ | $DC_CRITICAL | $DC_HIGH | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Trivy
          if [ -f "all-results/trivy-results/trivy-results.json" ]; then
            TRIVY_CRITICAL=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' all-results/trivy-results/trivy-results.json || echo "0")
            TRIVY_HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "HIGH")] | length' all-results/trivy-results/trivy-results.json || echo "0")
            echo "| Trivy | ✅ | $TRIVY_CRITICAL | $TRIVY_HIGH | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Detailed reports available in Actions artifacts" >> $GITHUB_STEP_SUMMARY

      - name: Upload Combined Report
        uses: actions/upload-artifact@v4
        with:
          name: security-summary-${{ github.run_number }}
          path: all-results/
          retention-days: 30