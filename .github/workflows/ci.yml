name: CI - Build and Push Docker Image

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true  # Load image vào local runner để scan (không push vội)
          tags: tienbui482/social-app:latest

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master  # Phiên bản mới nhất
        with:
          image-ref: 'tienbui482/social-app:latest'  # Scan image local
          format: 'sarif'  # Export report SARIF để tích hợp GitHub
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'  # Fail nếu có lỗ hổng cao
          exit-code: '1'  # Fail workflow nếu phát hiện vulnerabilities

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()  # Upload report dù fail hay pass
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image (only if scan passes)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: tienbui482/social-app:latest