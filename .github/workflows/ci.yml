name: CI Workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Security & Build Pipeline
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ========================================
      # SETUP
      # ========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # ========================================
      # CODEQL ANALYSIS
      # ========================================
#      - name: Initialize CodeQL
#        uses: github/codeql-action/init@v4
#        with:
#          languages: java
#      - name: Build for CodeQL
#        run: ./gradlew build -x test --no-daemon
#        continue-on-error: true
#      - name: Perform CodeQL Analysis
#        uses: github/codeql-action/analyze@v4
#        with:
#          category: "/language:java"
#          upload: false
#          output: codeql-results
#        continue-on-error: true
#      - name: Copy SARIF file
#        run: |
#          if [ -f "codeql-results/java.sarif" ]; then
#            cp codeql-results/java.sarif codeql-results.sarif
#            echo "✅ Copied SARIF file"
#          else
#            echo "⚠️ SARIF file not found, searching..."
#            find . -name "*.sarif" -type f -exec cp {} codeql-results.sarif \;
#          fi
#        continue-on-error: true
#      - name: Upload CodeQL Results
#        if: always()
#        uses: actions/upload-artifact@v4
#        with:
#          name: codeql-scan-results-${{ github.run_number }}
#          path: |
#            codeql-results.sarif
#            codeql-results/
#          retention-days: 30
#      - name: Convert CodeQL SARIF to Sonar format
#        run: |
#          if [ -f "scripts/convert_codeql_to_sonar.py" ]; then
#            python scripts/convert_codeql_to_sonar.py \
#              --input codeql-results.sarif \
#              --output sonar-issues.json
#          else
#            echo "⚠️ Converter script not found, creating empty report"
#            echo '{"issues":[]}' > sonar-issues.json
#          fi
#        continue-on-error: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
         languages: java
      - name: Build for CodeQL
        run: ./gradlew build -x test --no-daemon
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        env:
          CODEQL_ACTION_EXTRA_OPTIONS: '{"database": {"finalize": ["--no-upload"]}}'
        with:
          category: "/language:java"
          upload: false
          output: codeql-results
      - name: Copy SARIF file
        run: |
          if [ -f "codeql-results/java.sarif" ]; then
            cp codeql-results/java.sarif codeql-results.sarif
            echo "✅ Copied SARIF file"
          else
            echo "⚠️ SARIF file not found, searching..."
            find . -name "*.sarif" -type f -exec cp {} codeql-results.sarif \;
          fi
      - name: Convert CodeQL SARIF to Sonar format
        run: |
          if [ -f "scripts/convert_codeql_to_sonar.py" ]; then
            python scripts/convert_codeql_to_sonar.py \
              --input codeql-results.sarif \
              --output sonar-issues.json
          else
            echo "⚠️ Converter script not found, creating empty report"
            echo '{"issues":[]}' > sonar-issues.json
          fi
      - name: Upload CodeQL Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-scan-results-${{ github.run_number }}
          path: |
            codeql-results.sarif
          retention-days: 30
      # ========================================
      # CHECK CODEQL RESULTS
      # ========================================
      - name: Check CodeQL Results
        id: codeql_check
        run: |
          if [ -f "codeql-results.sarif" ]; then
            CRITICAL_COUNT=$(jq '[.runs[].results[] | select(.level == "error")] | length' codeql-results.sarif || echo "0")
            HIGH_COUNT=$(jq '[.runs[].results[] | select(.level == "warning")] | length' codeql-results.sarif || echo "0")

            echo "🔍 CodeQL Results:"
            echo "  - Critical/Error: $CRITICAL_COUNT"
            echo "  - High/Warning: $HIGH_COUNT"

            if [ "$CRITICAL_COUNT" -gt "0" ]; then
              echo "⚠️ CodeQL found $CRITICAL_COUNT critical issues!"
              echo "codeql_failed=true" >> $GITHUB_OUTPUT
            fi
          fi
        continue-on-error: true
      # ========================================
      # BUILD & TEST
      # ========================================
      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon -x test
        continue-on-error: true
      # ========================================
      # SONARQUBE SCAN (with Dependency-Check)
      # ========================================
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Verify SonarQube Connection
        id: sonar_verify
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "🔍 Verifying SonarQube configuration..."

          if [ -z "$SONAR_HOST_URL" ]; then
            echo "⚠️ WARNING: SONAR_HOST_URL is not set"
            echo "sonar_unavailable=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -z "$SONAR_TOKEN" ]; then
            echo "⚠️ WARNING: SONAR_TOKEN is not set"
            echo "sonar_unavailable=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          SONAR_URL="${SONAR_HOST_URL%/}"
          echo "✅ SonarQube URL: $SONAR_URL"

          # Test connection
          echo "🔗 Testing connection to SonarQube..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -u "${SONAR_TOKEN}:" "${SONAR_URL}/api/system/status" || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Successfully connected to SonarQube"
          else
            echo "⚠️ Cannot connect to SonarQube (HTTP $HTTP_CODE)"
            echo "sonar_unavailable=true" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      - name: SonarQube Scan with Dependency-Check
        if: steps.sonar_verify.outputs.sonar_unavailable != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          echo "🚀 Starting SonarQube scan with Dependency-Check..."

          SONAR_URL="${SONAR_HOST_URL%/}"

          GRADLE_OPTS="-Dsonar.dependencyCheck.htmlReportPath=build/reports/dependency-check-report.html"

          if [ -n "$NVD_API_KEY" ]; then
            echo "✅ Using NVD API Key"
            GRADLE_OPTS="$GRADLE_OPTS -Dsonar.dependencyCheck.nvd.apiKey=$NVD_API_KEY"
          else
            echo "⚠️ No NVD API Key provided"
          fi

          ./gradlew sonar \
            --info \
            --no-daemon \
            -Dsonar.projectKey=sast-social \
            -Dsonar.projectName=sast-social \
            -Dsonar.host.url="${SONAR_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=build/classes/java/main \
            -Dsonar.exclusions='**/test/**,**/build/**,**/node_modules/**' \
            -Dsonar.externalIssuesReportPaths=sonar-issues.json \
            $GRADLE_OPTS

          echo "✅ SonarQube scan completed"
          echo "📋 Generated reports:"
          ls -lh build/reports/ || echo "No reports found"
        continue-on-error: true
      - name: Upload SonarQube & Dependency-Check Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-dependency-check-results-${{ github.run_number }}
          path: |
            build/reports/dependency-check-report.*
            sonar-issues.json
            build/sonar/report-task.txt
            .scannerwork/
          retention-days: 30
      - name: Check SonarQube Quality Gate
        if: steps.sonar_verify.outputs.sonar_unavailable != 'true'
        id: quality_gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          scanMetadataReportFile: build/sonar/report-task.txt
          timeout: 300
        continue-on-error: true
      # ========================================
      # DOCKER BUILD & SCAN
      # ========================================
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest .
        continue-on-error: true
      - name: Scan Docker Image with Trivy
        id: trivy_scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
      - name: Generate Trivy JSON Report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest'
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
        continue-on-error: true
      - name: Generate Trivy Table Report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest'
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
        continue-on-error: true
      - name: Upload Trivy Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results-${{ github.run_number }}
          path: |
            trivy-results.sarif
            trivy-results.json
            trivy-results.txt
          retention-days: 30
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest
        continue-on-error: true
      # ========================================
      # UPLOAD ALL SECURITY REPORTS (Combined)
      # ========================================
      - name: Upload All Security Reports (Combined)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-security-reports-${{ github.run_number }}
          path: |
            codeql-results.sarif
            codeql-results/
            build/reports/dependency-check-report.*
            sonar-issues.json
            build/sonar/report-task.txt
            trivy-results.sarif
            trivy-results.json
            trivy-results.txt
          retention-days: 30
      # ========================================
      # FINAL STATUS SUMMARY
      # ========================================
      - name: Security Scan Summary
        if: always()
        run: |
          echo "================================================"
          echo "🔒 SECURITY SCAN SUMMARY"
          echo "================================================"

          if [ "${{ steps.codeql_check.outputs.codeql_failed }}" == "true" ]; then
            echo "⚠️ CodeQL: FAILED (Critical issues found)"
          else
            echo "✅ CodeQL: PASSED"
          fi

          if [ "${{ steps.sonar_verify.outputs.sonar_unavailable }}" == "true" ]; then
            echo "⚠️ SonarQube: SKIPPED (Unavailable)"
          elif [ "${{ steps.quality_gate.outcome }}" == "failure" ]; then
            echo "⚠️ SonarQube Quality Gate: FAILED"
          else
            echo "✅ SonarQube: PASSED"
          fi

          if [ "${{ steps.trivy_scan.outcome }}" == "failure" ]; then
            echo "⚠️ Trivy Scan: FAILED (Vulnerabilities found)"
          else
            echo "✅ Trivy Scan: PASSED"
          fi

          echo "================================================"
          echo "📦 All artifacts have been uploaded"
          echo "================================================"

