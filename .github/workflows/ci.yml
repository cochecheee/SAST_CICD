name: CI Workflow (Gradle)

on:
  push:
    branches:
      - main  # chỉ trigger khi có push (merge) vào main

jobs:
  ci:
    name: Security & Build Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # để SonarQube phân tích đầy đủ lịch sử

      # Set up JDK
      - name: Set up JDK 17 for Gradle
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java  # hoặc java-kotlin nếu dùng Kotlin

      # Build project (cần để CodeQL phân tích)
      - name: Build with Gradle
        run: ./gradlew compileJava --no-daemon

      # Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

      # Download SARIF file (CodeQL tự tạo)
      - name: Download CodeQL SARIF
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const glob = require('@actions/glob');
            const searchPath = 'codeql-results/**/*.sarif';
            const globber = await glob.create(searchPath);
            const files = await globber.glob();
            if (files.length === 0) throw new Error('No SARIF files found');
            // Copy the first SARIF file to known name
            const input = files[0];
            fs.copyFileSync(input, 'codeql-results.sarif');
            console.log(`Copied ${input} to codeql-results.sarif`);

      # Convert CodeQL SARIF to SonarQube format
      - name: Convert CodeQL SARIF to Sonar format
        run: |
          python scripts/convert_codeql_to_sonar.py \
            --input codeql-results.sarif \
            --output sonar-issues.json

      # Cài Dependency-Check (OWASP)
      - name: Install Dependency-Check
        run: |
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v9.2.0/dependency-check-9.2.0-release.zip
          unzip dependency-check-9.2.0-release.zip
          export PATH=$PATH:$(pwd)/dependency-check/bin
          echo "$PWD/dependency-check/bin" >> $GITHUB_PATH

      # Quét lỗ hổng dependency
      - name: Run Dependency-Check
        run: |
          dependency-check --scan . --out build/reports --format XML --format JSON

      # Build & Test
      - name: Build & Test (Gradle)
        run: ./gradlew clean build --no-daemon

      # SonarQube Scan (gộp cả các báo cáo)
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=sast-social
            -Dsonar.externalIssuesReportPaths=sonar-issues.json
            -Dsonar.dependencyCheck.xmlReportPath=build/reports/dependency-check-report.xml
            -Dsonar.dependencyCheck.jsonReportPath=build/reports/dependency-check-report.json

      # Kiểm tra Quality Gate
      - name: Check SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          timeout: 300

      # Build Docker image
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest .

      # Scan Docker image với Trivy
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Push image
      - name: Push Docker Image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest

      # Upload báo cáo Security làm artifact
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            build/reports/dependency-check-report.*
            sonar-issues.json