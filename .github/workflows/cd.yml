name: CD Workflow

on:
  workflow_run:
    workflows: ["CI Workflow"]
    types: [completed]
    branches:
      - main

jobs:
  cd:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Docker Image from CI
        run: |
          echo "🐳 Pulling Docker image from Docker Hub..."
          docker pull ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest
          echo "✅ Image pulled successfully"
          docker images | grep aloute-spring

      - name: Verify Docker Image
        run: |
          echo "🔍 Verifying Docker image..."
          docker inspect ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest
          echo "✅ Image verified"

      - name: Check if Render Service Exists
        id: check_service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_NAME: aloute-spring-app
        run: |
          echo "🔍 Checking if service exists..."
          
          # List all services and check if our service exists
          SERVICES=$(curl -s \
            "https://api.render.com/v1/services?name=${SERVICE_NAME}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}")
          
          SERVICE_ID=$(echo "$SERVICES" | jq -r '.[0].service.id // empty')
          
          if [ -z "$SERVICE_ID" ]; then
            echo "service_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Service not found, will create new one"
          else
            echo "service_exists=true" >> $GITHUB_OUTPUT
            echo "existing_service_id=$SERVICE_ID" >> $GITHUB_OUTPUT
            echo "✅ Found existing service: $SERVICE_ID"
          fi

      - name: Create Render Service
        if: steps.check_service.outputs.service_exists == 'false'
        id: create_service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "🆕 Creating new Render service..."
          
          # Create service payload
          PAYLOAD=$(cat <<EOF
          {
            "type": "web_service",
            "name": "aloute-spring-app",
            "ownerId": "OWNER_ID_PLACEHOLDER",
            "repo": "",
            "autoDeploy": "no",
            "image": {
              "ownerId": "OWNER_ID_PLACEHOLDER",
              "registryCredential": {
                "name": "docker-hub-creds",
                "username": "${DOCKER_USERNAME}",
                "password": "${DOCKER_PASSWORD}"
              },
              "imagePath": "docker.io/${DOCKER_IMAGE}"
            },
            "serviceDetails": {
              "env": "docker",
              "envSpecificDetails": {
                "docker": {
                  "dockerCommand": "",
                  "dockerContext": "."
                }
              },
              "region": "oregon",
              "plan": "free",
              "pullRequestPreviewsEnabled": "no",
              "healthCheckPath": "/actuator/health",
              "numInstances": 1,
              "openPorts": [
                {
                  "port": 8080,
                  "protocol": "TCP"
                }
              ]
            }
          }
          EOF
          )
          
          # Get owner ID first
          OWNER_INFO=$(curl -s \
            "https://api.render.com/v1/owners" \
            -H "Authorization: Bearer ${RENDER_API_KEY}")
          
          OWNER_ID=$(echo "$OWNER_INFO" | jq -r '.[0].owner.id // empty')
          
          if [ -z "$OWNER_ID" ]; then
            echo "❌ Failed to get owner ID"
            echo "Response: $OWNER_INFO"
            exit 1
          fi
          
          echo "✅ Owner ID: $OWNER_ID"
          
          # Replace placeholder with actual owner ID
          PAYLOAD=$(echo "$PAYLOAD" | sed "s/OWNER_ID_PLACEHOLDER/${OWNER_ID}/g")
          
          echo "Creating service with payload..."
          
          # Create service
          RESPONSE=$(curl -X POST \
            "https://api.render.com/v1/services" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-raw "$PAYLOAD")
          
          echo "Response: $RESPONSE"
          
          SERVICE_ID=$(echo "$RESPONSE" | jq -r '.service.id // .id // empty')
          
          if [ -z "$SERVICE_ID" ]; then
            echo "❌ Failed to create service"
            ERROR_MSG=$(echo "$RESPONSE" | jq -r '.message // .error // "Unknown error"')
            echo "Error: $ERROR_MSG"
            exit 1
          fi
          
          echo "new_service_id=$SERVICE_ID" >> $GITHUB_OUTPUT
          echo "✅ Service created successfully: $SERVICE_ID"

      - name: Set Service ID
        id: set_service
        run: |
          if [ "${{ steps.check_service.outputs.service_exists }}" == "true" ]; then
            echo "service_id=${{ steps.check_service.outputs.existing_service_id }}" >> $GITHUB_OUTPUT
          else
            echo "service_id=${{ steps.create_service.outputs.new_service_id }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ steps.set_service.outputs.service_id }}
        run: |
          echo "🚀 Deploying to Render..."
          echo "Service ID: ${SERVICE_ID}"
          
          # Trigger deployment
          RESPONSE=$(curl -X POST \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "clear"}')
          
          echo "Response: $RESPONSE"
          
          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          
          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" == "null" ]; then
            echo "❌ Failed to trigger deployment"
            ERROR_MSG=$(echo "$RESPONSE" | jq -r '.message // .error // "Unknown error"')
            echo "Error details: $ERROR_MSG"
            exit 1
          fi
          
          echo "✅ Deployment triggered successfully"
          echo "Deploy ID: $DEPLOY_ID"
          
          # Wait for deployment to complete
          echo "⏳ Waiting for deployment to complete..."
          MAX_WAIT=900
          ELAPSED=0
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            DEPLOY_STATUS=$(curl -s \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}")
          
            STATUS=$(echo "$DEPLOY_STATUS" | jq -r '.deploy.status // .status // "unknown"')
          
            echo "[${ELAPSED}s] Status: $STATUS"
          
            if [ "$STATUS" == "live" ]; then
              echo "✅ Deployment completed successfully!"
          
              # Get service URL
              SERVICE_INFO=$(curl -s \
                "https://api.render.com/v1/services/${SERVICE_ID}" \
                -H "Authorization: Bearer ${RENDER_API_KEY}")
          
              SERVICE_URL=$(echo "$SERVICE_INFO" | jq -r '.service.serviceDetails.url // "URL not available"')
              echo "🌐 Service URL: https://${SERVICE_URL}"
              exit 0
            elif [ "$STATUS" == "build_failed" ] || [ "$STATUS" == "deploy_failed" ] || [ "$STATUS" == "canceled" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              exit 1
            fi
          
            sleep 30
            ELAPSED=$((ELAPSED + 30))
          done
          
          echo "⚠️ Deployment timeout after ${MAX_WAIT}s"
          exit 1

      - name: Deployment Summary
        if: always()
        run: |
          echo "================================================"
          echo "📦 DEPLOYMENT SUMMARY"
          echo "================================================"
          echo "Docker Image: ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest"
          echo "Service ID: ${{ steps.set_service.outputs.service_id }}"
          echo "Service Exists: ${{ steps.check_service.outputs.service_exists }}"
          echo "Workflow Run: ${{ github.run_number }}"
          echo "================================================"