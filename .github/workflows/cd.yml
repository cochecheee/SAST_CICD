name: CD Workflow

on:
  workflow_run:
    workflows: ["CI Workflow"]
    types: [completed]
    branches:
      - main

jobs:
  cd:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Docker Image from CI
        run: |
          echo "🐳 Pulling Docker image from Docker Hub..."
          docker pull ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest
          echo "✅ Image pulled successfully"
          docker images | grep aloute-spring

      - name: Verify Docker Image
        run: |
          echo "🔍 Verifying Docker image..."
          docker inspect ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest
          echo "✅ Image verified"

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest
        run: |
          echo "🚀 Deploying to Render..."
          
          # Create JSON payload
          JSON_PAYLOAD=$(cat <<EOF
          {
            "clearCache": false,
            "imageUrl": "docker.io/${DOCKER_IMAGE}"
          }
          EOF
          )
          
          echo "Payload: $JSON_PAYLOAD"
          
          # Trigger Render deployment
          RESPONSE=$(curl -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-raw "$JSON_PAYLOAD")
          
          echo "Response: $RESPONSE"
          
          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          
          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" == "null" ]; then
            echo "❌ Failed to trigger deployment"
            ERROR_MSG=$(echo "$RESPONSE" | jq -r '.message // .error // "Unknown error"')
            echo "Error details: $ERROR_MSG"
            echo "Full response: $RESPONSE"
            exit 1
          fi
          
          echo "✅ Deployment triggered successfully"
          echo "Deploy ID: $DEPLOY_ID"
          
          # Wait for deployment to complete
          echo "⏳ Waiting for deployment to complete..."
          MAX_WAIT=900  # 15 minutes for Docker pull + deploy
          ELAPSED=0
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            DEPLOY_STATUS=$(curl -s \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}")
          
            STATUS=$(echo "$DEPLOY_STATUS" | jq -r '.status // "unknown"')
          
            echo "[${ELAPSED}s] Status: $STATUS"
          
            if [ "$STATUS" == "live" ]; then
              echo "✅ Deployment completed successfully!"
          
              # Get service URL
              SERVICE_INFO=$(curl -s \
                "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" \
                -H "Authorization: Bearer ${RENDER_API_KEY}")
          
              SERVICE_URL=$(echo "$SERVICE_INFO" | jq -r '.service.serviceDetails.url // .serviceDetails.url // "URL not available"')
              echo "🌐 Service URL: https://${SERVICE_URL}"
              exit 0
            elif [ "$STATUS" == "build_failed" ] || [ "$STATUS" == "deploy_failed" ] || [ "$STATUS" == "canceled" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              echo "Details: $DEPLOY_STATUS"
              exit 1
            elif [ "$STATUS" == "unknown" ]; then
              echo "⚠️ Could not retrieve deployment status"
              echo "Response: $DEPLOY_STATUS"
            fi
          
            sleep 30
            ELAPSED=$((ELAPSED + 30))
          done
          
          echo "⚠️ Deployment timeout after ${MAX_WAIT}s"
          echo "Last known status: $STATUS"
          exit 1

      - name: Deployment Summary
        if: always()
        run: |
          echo "================================================"
          echo "📦 DEPLOYMENT SUMMARY"
          echo "================================================"
          echo "Docker Image: ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest"
          echo "Render Service ID: ${{ secrets.RENDER_SERVICE_ID }}"
          echo "Workflow Run: ${{ github.run_number }}"
          echo "Triggered by: ${{ github.event.workflow_run.head_commit.message }}"
          echo "================================================"