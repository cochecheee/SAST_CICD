name: CD Workflow

on:
  workflow_run:
    workflows: ["CI Workflow - Skipped"]
    types: [completed]
    branches:
      - main

jobs:
  cd:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # Pull image was built on CI
      - name: Pull Docker Image from CI
        run: |
          echo "Pulling Docker image from Docker Hub..."
          docker pull ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest
          echo "Image pulled successfully"
          docker images | grep aloute-spring
      # Verify Docker image
      - name: Verify Docker Image
        run: |
          echo "Verifying Docker image..."
          docker inspect ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest
          echo "Image verified"


      # Deploy to Render via API
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Deploying to Render..."
          echo "Service ID: ${RENDER_SERVICE_ID}"
          
          # Simple deployment trigger
          RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json")
          
          echo "Response: $RESPONSE"
          
          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          
          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" == "null" ]; then
            echo "Failed to trigger deployment"
            ERROR_MSG=$(echo "$RESPONSE" | jq -r '.message // .error // "Unknown error"')
            echo "Error details: $ERROR_MSG"
            exit 1
          fi
          
          echo "Deployment triggered successfully"
          echo "Deploy ID: $DEPLOY_ID"
          
          # Wait for deployment to complete
          echo "Waiting for deployment to complete..."
          MAX_WAIT=900
          ELAPSED=0
          LAST_STATUS=""
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            DEPLOY_STATUS=$(curl -s \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}")
          
            STATUS=$(echo "$DEPLOY_STATUS" | jq -r '.deploy.status // .status // "unknown"')
          
            # Only print if status changed
            if [ "$STATUS" != "$LAST_STATUS" ]; then
              echo "[${ELAPSED}s] Status: $STATUS"
              LAST_STATUS=$STATUS
            fi
          
            if [ "$STATUS" == "live" ]; then
              echo "Deployment completed successfully!"
          
              # Get service URL
              SERVICE_INFO=$(curl -s \
                "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" \
                -H "Authorization: Bearer ${RENDER_API_KEY}")
          
              SERVICE_URL=$(echo "$SERVICE_INFO" | jq -r '.service.serviceDetails.url // "URL not available"')
              echo "Service URL: https://${SERVICE_URL}"
              echo "Dashboard: https://dashboard.render.com/web/${RENDER_SERVICE_ID}"
              exit 0
            elif [ "$STATUS" == "build_failed" ] || [ "$STATUS" == "deploy_failed" ] || [ "$STATUS" == "canceled" ]; then
              echo "Deployment failed with status: $STATUS"
          
              # Try to get logs
              LOGS=$(echo "$DEPLOY_STATUS" | jq -r '.deploy.deployLogs // "No logs available"')
              echo "Logs: $LOGS"
              exit 1
            fi
          
            sleep 30
            ELAPSED=$((ELAPSED + 30))
          done
          
          echo "Deployment timeout after ${MAX_WAIT}s"
          echo "Last known status: $STATUS"
          exit 1


      # Summary
      - name: Deployment Summary
        if: always()
        run: |
          echo "================================================"
          echo "DEPLOYMENT SUMMARY"
          echo "================================================"
          echo "Docker Image: ${{ secrets.DOCKER_USERNAME }}/aloute-spring:latest"
          echo "Render Service ID: ${{ secrets.RENDER_SERVICE_ID }}"
          echo "Workflow Run: ${{ github.run_number }}"
          echo "Commit: ${{ github.sha }}"
          echo "================================================"